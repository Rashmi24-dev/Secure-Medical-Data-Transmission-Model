<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Hospital | MediSecure</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:#0a0a0a;
display:flex;
justify-content:center;
align-items:center;
padding:30px 0;
}

.container{
width:90%;
max-width:650px;
}

.logo{
text-align:center;
color:#e0e0e0;
font-size:32px;
font-weight:700;
margin-bottom:25px;
}

.logo i{
color:#4a7ab5;
}

.card{
background:#111111;
padding:35px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.8);
border:1px solid #222222;
}

h1{
text-align:center;
color:#4a7ab5;
margin-bottom:25px;
font-size:26px;
}

.input-box{
margin-bottom:18px;
}

.input-box label{
display:block;
font-weight:600;
margin-bottom:7px;
color:#b0b0b0;
}

.input-box input,
.input-box textarea,
.input-box select{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #2a2a2a;
background:#1a1a1a;
color:#e0e0e0;
font-size:15px;
}

.input-box input:focus,
.input-box textarea:focus,
.input-box select:focus{
outline:none;
border-color:#4a7ab5;
}

.input-box textarea{
height:90px;
resize:none;
}

/* PDF Upload styling */
.input-box input[type="file"] {
    padding: 10px;
    cursor: pointer;
    color: #b0b0b0;
}
.input-box input[type="file"]::file-selector-button {
    padding: 10px 16px;
    margin-right: 15px;
    border: none;
    border-radius: 8px;
    background: #1e3a5f;
    color: #e0f0ff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}
.input-box input[type="file"]::file-selector-button:hover {
    background: #2a4a7a;
}

/* Current PDF Box */
.current-pdf {
    background: #1a2a3a;
    border: 1px dashed #4a7ab5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.pdf-info {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    flex: 1;
}

.pdf-name {
    color: #e0e0e0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.pdf-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.btn-view {
    background: #1e3a5f;
    color: #e0f0ff;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.btn-view:hover {
    background: #2a4a7a;
}

.btn-delete {
    background: #3a1a1a;
    color: #ff8080;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.btn-delete:hover {
    background: #4a1a1a;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1e3a5f;
color:#e0f0ff;
font-size:17px;
font-weight:600;
cursor:pointer;
margin-top: 10px;
}

.btn:hover{
background:#2a4a7a;
}

.back{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
width:fit-content;
margin:20px auto 0;
padding:14px 32px;
background:#2563eb;
color:#ffffff;
text-decoration:none;
border-radius:12px;
font-size:16px;
font-weight:600;
transition:background 0.2s ease;
}

.back:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<i class="fa-solid fa-heart-pulse"></i> MediSecure
</div>

<div class="card">

<h1>
<i class="fa-solid fa-pen-to-square"></i> Edit Hospital
</h1>

<!-- MUST ADD enctype for file upload to work -->
<form method="POST" enctype="multipart/form-data">

<div class="input-box">
<label>Hospital Name</label>
<input type="text" name="hospital_name" value="{{ hospital.hospital_name }}" required>
</div>

<div class="input-box">
<label>Registration ID</label>
<input type="text" name="registration_id" value="{{ hospital.registration_id }}" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" name="email" value="{{ hospital.email }}" required>
</div>

<div class="input-box">
<label>Phone</label>
<input type="text" name="phone" value="{{ hospital.phone }}" required>
</div>

<div class="input-box">
<label>City</label>
<input type="text" name="location" value="{{ hospital.location }}" required>
</div>

<div class="input-box">
<label>Address</label>
<textarea name="address">{{ hospital.address }}</textarea>
</div>

<div class="input-box">
<label>Specialization</label>
<select name="specialization">
<option {% if hospital.specialization=="Multi Speciality" %}selected{% endif %}>Multi Speciality</option>
<option {% if hospital.specialization=="Cardiology" %}selected{% endif %}>Cardiology</option>
<option {% if hospital.specialization=="Neurology" %}selected{% endif %}>Neurology</option>
<option {% if hospital.specialization=="Orthopedics" %}selected{% endif %}>Orthopedics</option>
<option {% if hospital.specialization=="General Medicine" %}selected{% endif %}>General Medicine</option>
<option {% if hospital.specialization=="Pediatrics" %}selected{% endif %}>Pediatrics</option>
<option {% if hospital.specialization=="Oncology" %}selected{% endif %}>Oncology</option>
</select>
</div>

<!-- PDF Upload Section -->
<div class="input-box">
    <label><i class="fa-solid fa-file-pdf" style="color:#e05252; margin-right:6px;"></i> Doctor Details PDF</label>
    
    {% if hospital.doctor_pdf %}
    <div class="current-pdf">
        <div class="pdf-info">
            <i class="fa-solid fa-file-pdf" style="color: #e05252; font-size: 20px;"></i>
            <span class="pdf-name" title="{{ hospital.doctor_pdf }}">{{ hospital.doctor_pdf }}</span>
        </div>
        <div class="pdf-actions">
            <a href="{{ url_for('view_hospital_pdf', hospital_id=hospital.hospital_id) }}" target="_blank" class="btn-view">
                <i class="fa-solid fa-eye"></i> View
            </a>
            <a href="{{ url_for('delete_hospital_pdf', hospital_id=hospital.hospital_id) }}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this PDF? You will need to upload a new one.');">
                <i class="fa-solid fa-trash"></i> Delete
            </a>
        </div>
    </div>
    {% endif %}
    
    <input type="file" name="doctor_pdf" accept="application/pdf">
    <p style="font-size: 12px; color: #777; margin-top: 5px;">
        Leave blank to keep the current PDF. Upload a new one to replace it.
    </p>
</div>

<button class="btn">
<i class="fa-solid fa-floppy-disk"></i> Update Hospital
</button>

</form>

</div>

<a href="/view_hospital" class="back">
<i class="fa-solid fa-arrow-left"></i> Back to Hospital List
</a>

</div>

</body>

</html>
